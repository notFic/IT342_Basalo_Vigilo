spring.application.name=vigilo
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8080

# Supabase PostgreSQL Connection (Sourced from .env)
spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail Configuration (optional; sourced from .env when available)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Application Settings
app.notifications.from-email=${MAIL_FROM:${MAIL_USERNAME:}}
app.notifications.facility-manager-email=${FACILITY_MANAGER_EMAIL:}
app.auto-close.poll-cron=${AUTO_CLOSE_POLL_CRON:0 * * * * ?}
app.auto-close.timezone=${AUTO_CLOSE_TIMEZONE:Asia/Manila}


app.google.client.id=798919010604-iqutc0snubu9i1u75abmv2il6jgjpbgf.apps.googleusercontent.com

